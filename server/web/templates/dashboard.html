{{ define "content" }}
<header>
  <h1>Dashboard</h1>
</header>

<section>
  <form method="post" action="/projects" style="display:flex;gap:0.5rem;align-items:flex-end;flex-wrap:wrap;">
    <div>
      <label for="name">New project</label>
      <input id="name" name="name" placeholder="My project" required style="margin-bottom:0;" />
    </div>
    <button type="submit" style="margin-bottom:var(--pico-spacing);">Create</button>
  </form>
</section>

{{ if .Projects }}
<ul class="project-list">
  {{ range .Projects }}
  <li><a href="/projects/{{ .Slug }}">{{ .Name }}</a> <small class="muted">{{ .Slug }}</small></li>
  {{ end }}
</ul>
{{ else }}
<p class="muted">No projects yet.</p>
{{ end }}
{{ end }}
