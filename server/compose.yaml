services:
  postgres:
    image: postgres:18
    container_name: ghapp-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ghapp_demo
      POSTGRES_PASSWORD: ghapp_demo
      POSTGRES_DB: ghapp_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghapp_demo -d ghapp_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres18_data:
