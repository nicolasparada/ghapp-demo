name: Deploy control-plane to Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-control-plane.yml"

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_DIR: server/infra/terraform
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  ARTIFACT_REPOSITORY_ID: control-plane
  IMAGE_NAME: control-plane-server

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_artifact_repository_id: control-plane
      TF_VAR_base_url: ${{ vars.CONTROL_PLANE_BASE_URL || 'https://example.invalid' }}
      TF_VAR_github_client_id: ${{ vars.CONTROL_PLANE_GITHUB_CLIENT_ID }}
      TF_VAR_github_client_secret: ${{ secrets.CONTROL_PLANE_GITHUB_CLIENT_SECRET }}
      TF_VAR_github_app_id: ${{ vars.CONTROL_PLANE_GITHUB_APP_ID }}
      TF_VAR_github_app_install_url: ${{ vars.CONTROL_PLANE_GITHUB_APP_INSTALL_URL || 'https://github.com/apps/ghapp-demo-app/installations/new' }}
      TF_VAR_github_app_private_key: ${{ secrets.CONTROL_PLANE_GITHUB_APP_PRIVATE_KEY }}
      TF_VAR_github_app_webhook_secret: ${{ secrets.CONTROL_PLANE_GITHUB_APP_WEBHOOK_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate required CI variables and secrets
        env:
          VAR_GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VAR_GCP_REGION: ${{ vars.GCP_REGION }}
          VAR_GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          VAR_GCP_WIF_SERVICE_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          VAR_TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          missing=0

          for name in \
            VAR_GCP_PROJECT_ID \
            VAR_GCP_REGION \
            VAR_GCP_WIF_PROVIDER \
            VAR_GCP_WIF_SERVICE_ACCOUNT \
            VAR_TF_STATE_BUCKET
          do
            value="${!name}"
            if [ -z "${value}" ]; then
              echo "::error::Missing repository variable for ${name}"
              missing=1
            fi
          done



          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Ensure foundational APIs are enabled
        run: |
          gcloud services enable \
            cloudresourcemanager.googleapis.com \
            serviceusage.googleapis.com \
            iam.googleapis.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: |
          terraform -chdir="${TERRAFORM_DIR}" init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=control-plane"

      - name: Ensure Artifact Registry exists
        run: |
          if gcloud artifacts repositories describe "${ARTIFACT_REPOSITORY_ID}" --location="${REGION}" >/dev/null 2>&1; then
            echo "Artifact Registry repository already exists"
          else
            gcloud artifacts repositories create "${ARTIFACT_REPOSITORY_ID}" \
              --repository-format=docker \
              --location="${REGION}" \
              --description="Control-plane server images"
          fi

      - name: Import Artifact Registry repository into Terraform state (if needed)
        run: |
          if terraform -chdir="${TERRAFORM_DIR}" state show google_artifact_registry_repository.server >/dev/null 2>&1; then
            echo "Artifact Registry repository already in Terraform state"
          else
            terraform -chdir="${TERRAFORM_DIR}" import \
              google_artifact_registry_repository.server \
              "projects/${PROJECT_ID}/locations/${REGION}/repositories/${ARTIFACT_REPOSITORY_ID}"
          fi

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push control-plane image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY_ID}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

          docker build -f server/Dockerfile -t "${IMAGE_URI}" server
          docker push "${IMAGE_URI}"

      - name: Terraform apply
        run: |
          terraform -chdir="${TERRAFORM_DIR}" apply -auto-approve \
            -var="container_image=${IMAGE_URI}"

      - name: Show Cloud Run URL
        run: terraform -chdir="${TERRAFORM_DIR}" output cloud_run_service_url
